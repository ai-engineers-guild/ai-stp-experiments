schema_version: 1
objects:
- altScreenMode
states:
  baseline:
    paths:
    - path: antigravity-cli/settings.json
      exists: false
  installed:
    paths:
    - path: antigravity-cli/settings.json
      exists: true
  restored:
    same_as: baseline
fixture_type: component
variants:
  antigravity:
    payload: payload/harnesses/antigravity
    managed_paths:
    - antigravity-cli/settings.json
  grok-build:
    payload: payload/harnesses/grok-build
    managed_paths:
    - config.toml
  pi:
    payload: payload/harnesses/pi
    managed_paths:
    - settings.json
    objects:
    - tuiMode
  codex:
    payload: payload/harnesses/codex
    managed_paths:
    - config.toml
    source_subpath: config.toml
    authoring_path: .codex/config.toml
