[mcp_servers.experiment_mcp01]
command = "py"
args = ["-3", "-u", "-c", """
import json, sys
for line in sys.stdin:
    request = json.loads(line)
    if request.get('id') is None:
        continue
    method = request.get('method')
    result = {'jsonrpc': '2.0', 'id': request.get('id')}
    if method == 'initialize':
        result['result'] = {'protocolVersion': '2024-11-05', 'capabilities': {'tools': {}}, 'serverInfo': {'name': 'experiment_mcp01', 'version': '1.0'}}
    elif method == 'tools/list':
        result['result'] = {'tools': [{'name': 'ai_stp_mcp01_probe', 'description': 'Return the installed MCP marker.', 'inputSchema': {'type': 'object', 'properties': {}}}]}
    elif method == 'tools/call':
        result['result'] = {'content': [{'type': 'text', 'text': 'AI_STP_MCP01'}]}
    else:
        result['result'] = {}
    print(json.dumps(result), flush=True)
"""]
startup_timeout_sec = 20
