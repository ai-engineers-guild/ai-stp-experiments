schema_version: 1
objects:
- PreToolUse:run_command
states:
  baseline:
    paths:
    - path: config/hooks.json
      exists: false
    - path: config/hooks/h01.py
      exists: false
  installed:
    paths:
    - path: config/hooks.json
      exists: true
    - path: config/hooks/h01.py
      exists: true
  restored:
    same_as: baseline
fixture_type: component
variants:
  antigravity:
    payload: payload/harnesses/antigravity
    managed_paths:
    - config/hooks.json
    - config/hooks/h01.py
    source_subpath: config
    authoring_path: .agents
  pi:
    payload: payload/harnesses/pi
    exclude: [config]
    managed_paths:
    - extensions/experiment-h01.ts
    source_subpath: extensions/experiment-h01.ts
    authoring_path: .pi/extensions/experiment-h01.ts
  grok-build:
    payload: payload/harnesses/grok-build
    managed_paths:
    - hooks/hooks.json
    source_subpath: hooks/hooks.json
    authoring_path: .grok/hooks/hooks.json
  codex:
    payload: payload/harnesses/codex
    exclude: [config]
    managed_paths:
    - hooks.json
    source_subpath: hooks.json
    authoring_path: .codex/hooks.json
