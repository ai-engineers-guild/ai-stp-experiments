schema_version: 1
objects:
- Stop:*
states:
  baseline:
    paths:
    - path: config/hooks.json
      exists: false
    - path: config/hooks/h10.py
      exists: false
  installed:
    paths:
    - path: config/hooks.json
      exists: true
    - path: config/hooks/h10.py
      exists: true
  restored:
    same_as: baseline
