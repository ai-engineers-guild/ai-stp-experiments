schema_version: 1
objects:
- PostToolUse:list_dir
states:
  baseline:
    paths:
    - path: config/hooks.json
      exists: false
    - path: config/hooks/h04.py
      exists: false
  installed:
    paths:
    - path: config/hooks.json
      exists: true
    - path: config/hooks/h04.py
      exists: true
  restored:
    same_as: baseline
fixture_type: component
variants:
  antigravity:
    payload: payload/harnesses/antigravity
    managed_paths:
    - config/hooks.json
    - config/hooks/h04.py
  grok-build:
    payload: payload/harnesses/grok-build
    managed_paths:
    - hooks/hooks.json
    - hooks/h04.py
  pi:
    payload: payload/harnesses/pi
    managed_paths:
    - extensions/experiment-h04.ts
  codex:
    payload: payload/harnesses/codex
    exclude:
    - config
    managed_paths:
    - hooks.json
    source_subpath: hooks.json
    authoring_path: .codex/hooks.json
