schema_version: 1
id: M01
component_type: setup
fixtures:
- hooks
- mcp
- settings
- M01-skill-a
- M01-skill-b
- M01-agent-a
- M01-agent-b
minimum_objects:
  skill: 2
  hook: 2
  mcp: 2
  setting: 2
  agent: 2
observe:
  probe: Use both M01 skills, use both M01 agents, call MCP tools
    `m01_mcp_a_probe` and `m01_mcp_b_probe`, run
    `Get-ChildItem .` to trigger H01, and run a harmless shell command containing
    `AI_STP_H02_TRIGGER`
    to trigger H02; confirm startup accepts `enableTelemetry` and `showTips`, and
    report every returned marker and hook result. Do not edit files.
  pi_probe:
    mode: composite
    tools: [powershell]
    commands:
    - Get-ChildItem .
    - Write-Output AI_STP_H02_TRIGGER
    settings:
      enableInstallTelemetry: false
      quietStartup: true
  antigravity_probe:
    probe: Invoke both M01 skills and both M01 agents, call MCP tools
      `m01_mcp_a_probe` and `m01_mcp_b_probe`, then invoke `run_command` once and
      `list_dir` once so the two declared hooks are exercised through their exact
      matchers. Confirm startup accepts `enableTelemetry` and `showTips`. Report
      every marker and each hook decision separately; do not treat an expected
      hook decision as a failed component invocation. Do not edit files.
  codex_probe:
    probe: Invoke $M01-skill-a and $M01-skill-b, spawn both installed custom agents,
      call MCP tools m01_mcp_a_probe and m01_mcp_b_probe, run a directory listing
      through Bash to trigger the first hook, run a harmless shell command containing
      the second hook trigger token, and ask for the installed settings markers.
      Do not read skill files from disk and do not edit files.
  expect:
    skills:
    - M01-skill-a
    - M01-skill-b
    hooks:
    - H01
    - H02
    mcps:
    - m01-mcp-a
    - m01-mcp-b
    settings:
    - enableTelemetry
    - showTips
    subagents:
    - M01-agent-a
    - M01-agent-b
variants:
- antigravity
- grok-build
- pi
- codex
