[mcp_servers.M03_mcp_a]
command = "python"
args = ["-u", "-c", '''from mcp.server.fastmcp import FastMCP
mcp = FastMCP("M03_mcp_a")
@mcp.tool()
def probe() -> str:
 """Return the deterministic M03 A marker."""
 return "AI_STP_M03_MCP_A"
mcp.run(transport="stdio")''']

