schema_version: 1
objects:
- M04-mcp-a
- M04-mcp-b
states:
  baseline:
    paths:
    - path: config/mcp_config.json
      exists: false
  installed:
    paths:
    - path: config/mcp_config.json
      exists: true
  restored:
    same_as: baseline
fixture_type: component
variants:
  antigravity:
    payload: payload/harnesses/antigravity
    managed_paths:
    - config/mcp_config.json
  grok-build:
    payload: payload/harnesses/grok-build
    managed_paths:
    - config.toml
  pi:
    payload: payload/harnesses/pi
    managed_paths:
    - extensions/m04-mcps/package.json
    - extensions/m04-mcps/index.ts
    - extensions/m04-mcps/.mcp.json
  codex:
    payload: payload/harnesses/codex
    exclude:
    - .mcp.json
    managed_paths:
    - config.toml
    source_subpath: config.toml
    authoring_path: .codex/config.toml
