schema_version: 2
id: E14
title: Голый + один скилл find-skills
prompt: Use find-skills. Name one command to search skills. Do not install anything.
expect: На голом ящике Agy умеет воспользоваться только find-skills. Если apply без
  провайдера падает — verdict=blocked.
expected_verdict: blocked
diagnostic:
  reason: the original named skill fixture is unavailable
  expected_error: AI_STP_NEEDS_CONFIGURATION
phases:
  prepare:
  - id: doctor
    argv:
    - ${ai_stp}
    - doctor
    - --json
  - id: discover
    argv:
    - ${ai_stp}
    - component
    - discover
    - --json
  install: []
  verify: []
