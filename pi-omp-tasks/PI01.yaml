schema_version: 2
harness_profile: pi-omp
id: PI01
fixtures:
- source: ${experiments}/fixtures/pi-omp/instruction/AGENTS.md
  destination: AGENTS.md
cleanup_requires:
- backup_ref
phases:
  prepare:
  - id: discover
    argv:
    - ${ai_stp}
    - component
    - discover
    - --root
    - ${user_home}
    - --json
  - id: adopt
    argv:
    - ${ai_stp}
    - component
    - adopt
    - --path
    - ${user_home}\AGENTS.md
    - --root
    - ${user_home}
    - --json
    capture:
      component_id: data.stable_id
      component_revision: data.revision_id
  - id: developer
    argv:
    - ${ai_stp}
    - passport
    - developer
    - init
    - --json
  - id: device
    argv:
    - ${ai_stp}
    - passport
    - device
    - refresh
    - --json
  - id: project
    argv:
    - ${ai_stp}
    - project
    - passport
    - --root
    - ${project}
    - --json
  - id: update
    argv:
    - ${ai_stp}
    - component
    - passport
    - update
    - --id
    - ${component_id}
    - --expected-revision
    - ${component_revision}
    - --from
    - ${experiments}/fixtures/pi-omp/instruction/passport-patch.json
    - --confirm
    - --json
  - id: release
    argv:
    - ${ai_stp}
    - component
    - version
    - release
    - --id
    - ${component_id}
    - --json
  - id: propose
    argv:
    - ${ai_stp}
    - select
    - propose
    - --harness
    - ${harness_id}
    - --project
    - ${project}
    - --member
    - ${component_id}@1.0
    - --json
    capture:
      proposal_id: data.proposals.0.proposal_id
  - id: confirm
    argv:
    - ${ai_stp}
    - select
    - confirm
    - --proposal
    - ${proposal_id}
    - --confirm
    - --json
    capture:
      setup_id: data.stable_id
  install:
  - id: plan
    argv:
    - ${ai_stp}
    - install
    - plan
    - --setup
    - ${setup_id}@1.0
    - --project
    - ${project}
    - --harness
    - ${harness_id}
    - --provider
    - ${provider}
    - --unverified-provider
    - --protocol-version
    - '3'
    - --target
    - ${target}
    - --json
    capture:
      operation_id: data.operation_id
      plan_digest: data.plan_digest
  - id: approve
    argv:
    - ${ai_stp}
    - install
    - approve
    - --operation
    - ${operation_id}
    - --plan-digest
    - ${plan_digest}
    - --json
  - id: apply
    argv:
    - ${ai_stp}
    - install
    - apply
    - --operation
    - ${operation_id}
    - --provider
    - ${provider}
    - --json
    capture:
      backup_ref: data.backup_ref
    expect_json:
      ok: true
      data.state: verified
  verify:
  - id: observer
    argv:
    - ${python}
    - ${delegate}
    - --harness
    - ${harness_id}
    - --backend
    - ${delegate_backend}
    - --runtime
    - ${runtime}
    - --target
    - ${target}
    - --cwd
    - ${project}
    - --timeout
    - 3m
    - --no-tools
    - --output-dir
    - ${run_root}\observer
    - --task
    - Reply with exactly PI_OMP_INSTRUCTION_OK if your active instructions contain
      PI_OMP_INSTRUCTION_OK; otherwise reply MISSING.
    expect_json_contains:
      response: PI_OMP_INSTRUCTION_OK
  cleanup:
  - id: rollback-plan
    argv:
    - ${ai_stp}
    - install
    - plan
    - --action
    - rollback
    - --backup-ref
    - ${backup_ref}
    - --project
    - ${project}
    - --harness
    - ${harness_id}
    - --provider
    - ${provider}
    - --unverified-provider
    - --protocol-version
    - '3'
    - --target
    - ${target}
    - --json
    capture:
      rollback_operation: data.operation_id
      rollback_digest: data.plan_digest
  - id: rollback-approve
    argv:
    - ${ai_stp}
    - install
    - approve
    - --operation
    - ${rollback_operation}
    - --plan-digest
    - ${rollback_digest}
    - --json
  - id: rollback-apply
    argv:
    - ${ai_stp}
    - install
    - apply
    - --operation
    - ${rollback_operation}
    - --provider
    - ${provider}
    - --json
    expect_json:
      ok: true
      data.state: verified
