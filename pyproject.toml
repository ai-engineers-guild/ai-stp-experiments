[project]
name = "ai-stp-experiments"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[tool.setuptools]
py-modules = ["compose", "delegate", "doctor", "materialize", "matrix", "run_experiment"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [".repo-safety", "build", "dist"]
