schema_version: 2
id: E32
title: Голый + один уникальный credential-free MCP
prompt: Call ai_stp_e32_probe from ai-stp-e32-local and report its exact result. Do
  not edit files.
expect: Agy вызывает только уникальный локальный endpoint и возвращает AI_STP_MCP_E32_OK.
observer_failure_verdict: blocked
fixtures:
- source: ${experiments}/fixtures/mcp-local/config/mcp_config.json
  destination: .gemini/config/mcp_config.json
phases:
  prepare:
  - id: doctor
    argv:
    - ${ai_stp}
    - doctor
    - --json
  - id: discover
    argv:
    - ${ai_stp}
    - component
    - discover
    - --json
  - id: adopt
    argv:
    - ${ai_stp}
    - component
    - adopt
    - --path
    - ${user_home}/.gemini/config/mcp_config.json
    - --json
    capture:
      component_id: data.stable_id
      component_revision: data.revision_id
  - id: developer
    argv:
    - ${ai_stp}
    - passport
    - developer
    - init
    - --json
  - id: device
    argv:
    - ${ai_stp}
    - passport
    - device
    - refresh
    - --json
  - id: project
    argv:
    - ${ai_stp}
    - project
    - passport
    - --root
    - ${project}
    - --json
  - id: update
    argv:
    - ${ai_stp}
    - component
    - passport
    - update
    - --id
    - ${component_id}
    - --expected-revision
    - ${component_revision}
    - --from
    - ${experiments}/fixtures/mcp-local/passport-patch.json
    - --confirm
    - --json
    capture:
      component_revision: data.revision_id
  - id: release
    argv:
    - ${ai_stp}
    - component
    - version
    - release
    - --id
    - ${component_id}
    - --json
  - id: propose
    argv:
    - ${ai_stp}
    - select
    - propose
    - --harness
    - ${harness_id}
    - --project
    - ${project}
    - --member
    - ${component_id}@1.0
    - --json
    capture:
      proposal_id: data.proposals.0.proposal_id
  - id: confirm
    argv:
    - ${ai_stp}
    - select
    - confirm
    - --proposal
    - ${proposal_id}
    - --confirm
    - --json
    capture:
      setup_id: data.stable_id
  install:
  - id: plan
    argv:
    - ${ai_stp}
    - install
    - plan
    - --setup
    - ${setup_id}@1.0
    - --project
    - ${project}
    - --harness
    - ${harness_id}
    - --provider
    - ${provider}
    - --unverified-provider
    - --protocol-version
    - '3'
    - --target
    - ${target}
    - --json
    capture:
      operation_id: data.operation_id
      plan_digest: data.plan_digest
  - id: approve
    argv:
    - ${ai_stp}
    - install
    - approve
    - --operation
    - ${operation_id}
    - --plan-digest
    - ${plan_digest}
    - --json
  - id: apply
    argv:
    - ${ai_stp}
    - install
    - apply
    - --operation
    - ${operation_id}
    - --provider
    - ${provider}
    - --json
    expect_json:
      ok: true
      data.state: verified
  verify:
  - id: observer
    argv:
    - ${python}
    - ${delegate}
    - --harness
    - ${harness_id}
    - --backend
    - ${delegate_backend}
    - --cwd
    - ${project}
    - --target
    - ${target}
    - --timeout
    - 3m
    - --output-dir
    - ${run_root}\observer
    - --always-approve
    - --task
    - Call ai_stp_e32_probe from ai-stp-e32-local and report its exact result. Do
      not edit files.
    expect_exit: 0
    expect_json:
      exit_code: 0
      raw.status: SUCCESS
    expect_json_contains:
      response: list_pages
expect_paths:
- path: ${target}/config/mcp_config.json
  contains: playwright
