expect: На голом ящике Agy умеет воспользоваться только skill-conductor. Если apply
  без провайдера падает — verdict=blocked.
expected_verdict: blocked
diagnostic:
  reason: the original named skill fixture is unavailable
  expected_error: AI_STP_NEEDS_CONFIGURATION
phases:
